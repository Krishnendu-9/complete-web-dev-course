<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <h1>Login form</h1>
    <form action="">
        <!-- <input type="MR. Teacher" placeholder="teacher name"> -->

        <label for="Email">
            Email:
            <input type="email" name="Email" id="email" placeholder="Enter your email"> 
        </label>
      <br>
      <br>
        <label for="password">
            Password:
            <input type="password" name="password" id="password" placeholder="Enter your password">
        </label>
        <button type="reset">Reset the form</button>
        <br>
        <br>
        <button type="submit">Login by clicking</button>
    </form>

    <div>
        <h1>learning form</h1>
        <form>
            <label for="email">
                Email:
                <input type="email" name="email" id="email" placeholder="Enter your email">
            </label>
            <br><br>
            <label for="paragraph">
                Paragraph:
                <textarea name="paragraph" id="paragraph" cols="30" rows="10" placeholder="Enter your paragraph"></textarea>
            </label>
            <button type="submit">submit button</button>
        </form>
    </div>

    <div>
        <h1>Different input tags</h1>
        <form >
            <label for="Games">
                Games:
                <br>
                <input type="radio" name="Cricket" id="1">Cricket
                <input type="radio" name="Football" id="2">Football
            </label>
            <br><br>
            <label for="subject">
                Subject:
                <br>
                <input type="checkbox" name="C" id="1"> C
                <input type="checkbox" name="JAVA" id="2"> JAVA
            </label>
            <br><br>
            <label for="Course">
                Course:
                <br>
                <select name="BSC" id="1">
                    <option value="BSC">BSc</option>
                    <option value="BCOM">BCom</option>
                    <option value="BA">BA</option>
                </select> 
            </label>
            <br><br>
            <label for="Months">
                <input type="month" name="" id="">
            </label>
        </form>
    </div>
    
</body>
</html>
